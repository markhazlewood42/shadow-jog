<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage lab (Phaser)</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2307060d'/%3E%3Cpath d='M2 12 L8 6 L14 12' stroke='%238ae8ff' stroke-width='1.6' fill='none'/%3E%3C/svg%3E" />
    <!-- Dev-only page (npm run dev, then /stagelab.html): the battle stage built in Phaser 4, spike
         `spike/phaser-stage` (docs/spikes/phaser-stage.md). Not part of the build: vite builds index.html
         only, so Phaser is not in the shipped game. Code: src/stage/. -->
    <style>
      html, body { margin: 0; height: 100%; background: #07060d; overflow: hidden; }
      /* Phaser puts its canvas in here and centres it; the box must have a size for that to work. */
      #stage { position: fixed; inset: 0; }
      /* Phaser draws the canvas at a whole-number zoom, so ask the browser for hard pixel edges too. */
      #stage canvas { image-rendering: pixelated; }
      #status { position: fixed; left: 12px; bottom: 10px; max-width: calc(100% - 24px); font: 13px/1.4 system-ui, 'Segoe UI', sans-serif; color: #9b96ad; white-space: pre-wrap; }
      #status.bad { color: #ff5a5a; }
      /* The three pickers (stage, enemy group, moment of the turn): lab furniture in the top-right corner; H hides them, ?clean leaves them out. */
      #labbar { position: fixed; top: 6px; right: 6px; display: flex; gap: 8px; padding: 4px 8px; background: rgba(7, 6, 13, 0.82); border: 1px solid #3a3f6e; border-radius: 4px; font: 12px/1.3 system-ui, 'Segoe UI', sans-serif; color: #c9c6dc; }
      #labbar[hidden] { display: none; }
      #labbar label { display: flex; align-items: center; gap: 4px; }
      #labbar select { font: inherit; color: #f4f1ff; background: #1c1a3a; border: 1px solid #4a4f86; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="labbar"></div>
    <div id="status">Loading the stage…</div>
    <script type="module" src="/src/stage/lab.ts"></script>
  </body>
</html>
