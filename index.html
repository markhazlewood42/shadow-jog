<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#07060d" />
    <meta name="description" content="SHADOW JOG — a cyberpunk-fantasy JRPG. One easy job. What could go wrong?" />
    <title>SHADOW JOG</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2307060d'/%3E%3Cpath d='M3 12 L8 3 L13 12 Z' fill='none' stroke='%23ff4fb0' stroke-width='1.6'/%3E%3Ccircle cx='8' cy='9' r='1.4' fill='%233fe0f0'/%3E%3C/svg%3E" />
    <style>
      html, body {
        height: 100%;
        overflow: hidden;
        background: #07060d;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      body { margin: 0; }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #screen {
        display: block;
        image-rendering: auto;
        outline: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6a6f89;
        font: 12px/1.4 ui-monospace, Consolas, monospace;
        letter-spacing: 0.2em;
      }
      #boot.error { color: #ff6b6b; letter-spacing: 0; padding: 24px; text-align: center; white-space: pre-wrap; }
      noscript { color: #b3b7c7; font: 14px/1.5 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="screen" tabindex="0" aria-label="SHADOW JOG game screen"></canvas></div>
    <div id="boot">LOADING…</div>
    <noscript>SHADOW JOG needs JavaScript to run.</noscript>
    <script>
      // Anything that goes wrong before the game is running (a script that fails to load, or
      // throws while it's being imported) is shown here, not left as LOADING… forever.
      window.addEventListener('error', function (e) {
        if (window.__sjStarted) return;
        var el = document.getElementById('boot');
        if (!el) return;
        el.className = 'error';
        el.style.display = 'flex';
        el.textContent = 'SHADOW JOG failed to start.\n\n' + ((e.error && e.error.message) || e.message || 'A game file failed to load. Check your connection and reload.');
      }, true);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
