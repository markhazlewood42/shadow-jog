# TEMPORARY: reads the CI-only failures of PR #58. Delete when done.
name: m6-debug
on:
  push:
    branches: [engine-m6-flip]
    paths: ['.github/workflows/m6-debug.yml']
jobs:
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium e2e/gpufx.spec.ts e2e/sje-battle.spec.ts e2e/default-path.spec.ts e2e/playthrough.spec.ts --reporter=list --max-failures=8
        env:
          CI: '1'
