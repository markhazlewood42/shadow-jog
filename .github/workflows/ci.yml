# CI for pull requests and for pushes to main.
#
# The jobs run at the same time (`e2e-shards` is eight shards, so it counts as eight). None waits for another except the `e2e` gate, so a pull
# request waits for the slowest job, not for all of them added together. The full strategy, with a diagram, is in docs/CI.md.
#
#   check        lint, typecheck, unit tests and the bundle budget (both builds, the game and the lab page). The ruleset on main
#                requires this check by name. So the job id must stay `check`, it must not get a different
#                `name:`, and it must always start and report (see "Check which files changed"
#                below). On a docs-only pull request it runs only tests/roadmap.test.ts (it reads docs/).
#   e2e-shards   the Playwright specs, on Chromium (the engine canary suite and the default-path goldens included), split into eight shards by a matrix. The checks are
#                named `e2e (1/8)` to `e2e (8/8)`. The ruleset must NOT require these names (see the gate below). Each shard has its own named spec list in the matrix (`--shard` split by test
#                count and was lopsided). The cap is 30 minutes for each shard.
#   e2e          the gate. It needs every shard, and it fails unless the shards' result is `success` (a failed, cancelled or skipped shard fails it). From PR #64 on, the ruleset on main must
#                require `check`, `e2e-engines` and `e2e` (Mark set it on 2026-10-11), so the number of shards can change
#                with no ruleset change. Keep the job id and name `e2e`.
#   e2e-engines  the game over and shipped-build specs, on WebKit (the whole flow) and Firefox (the E5 message: no WebGL 2 on this runner)
#
# A change that touches only docs/, *.md files, tools/command-center/ or the Claude review workflow
# (.github/workflows/claude-code-review.yml) needs none of this, so the work is skipped (see
# `paths-ignore` below and the step "Check which files changed").
#
# The real-speed playtest is not here. Its own limit is 30 minutes, so it has its own workflow,
# playtest.yml, which runs after a change lands on main.
name: CI

on:
  push:
    branches: [main]
    # A push to main that changes only these paths does not start the workflow. That is safe on a
    # push, because no check is required there. Keep this list the same as the `case` list in the
    # "Check which files changed" step of each job below, and as the list in playtest.yml. If a
    # build step or a test ever starts to read one of these paths, take it off every one of them.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'tools/command-center/**'
      - '.github/workflows/claude-code-review.yml'
  # No paths-ignore on pull_request, on purpose. A workflow that a path filter skips never reports,
  # so its required checks stay "Pending" and the pull request cannot merge. Here the jobs always
  # start, and each one skips its own steps when the change needs no checks.
  pull_request:
  # A full run by hand (Actions tab, Run workflow). The "Check which files changed" step runs only on a pull request, so a manual run is always a full run.
  workflow_dispatch:

# The jobs only read the code, so the token gets no more than that.
permissions:
  contents: read

# One run at a time for each pull request or branch. A new push to a pull request cancels the run
# that it makes useless. A run on main is never canceled once it starts: the next push waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Generous on purpose: this job is quick. The limit only stops a hung job (GitHub's default is
    # 6 hours).
    timeout-minutes: 10
    steps:
      # Two commits are enough. On a pull request the checked-out commit is a merge commit, and its
      # two parents are the base branch and the pull request (the next step compares them).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # A pull request that changes only docs, notes (*.md), tools/command-center or the Claude review
      # workflow file needs no lint, build or browser run. This step finds that out. Every later
      # step of the job then runs only `if: steps.scope.outputs.skip != 'true'`. The job itself is
      # never skipped as a whole: a skipped job reports success without checking anything, and a
      # required check must not pass that way.
      #
      # It fails closed. `skip` is `true` only when git lists changed files and every one of them
      # is on the list below. If git fails, lists nothing, or HEAD is not a merge commit, the step
      # writes `skip=false`. If the step itself breaks (`continue-on-error`) or does not run (on a
      # push), `skip` is unset. In both cases the job runs in full. That is why the later steps
      # test `!= 'true'` and not `== 'false'`: an unset `skip` must run everything too.
      #
      # On a pull_request event the checked-out HEAD is a merge commit, and its first parent is the
      # tip of the base branch. So `git diff HEAD^1 HEAD` is exactly what the pull request changes.
      # --no-renames lists a moved file as a delete plus an add. Without it, a file moved from src/
      # into docs/ would show only its new name and pass for a docs change.
      #
      # Every job has its own copy of this step, on purpose. One shared detection job could fail or
      # be skipped, and a required check must never depend on that. Keep the three copies
      # identical. The step does not run on a push: there the paths-ignore list above does this
      # work, and HEAD^1 would not show the whole push.
      - name: Check which files changed
        id: scope
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          skip=false
          if git rev-parse --verify --quiet 'HEAD^2' > /dev/null \
              && files=$(git diff --no-renames --name-only 'HEAD^1' HEAD) \
              && [ -n "$files" ]; then
            printf 'Changed files:\n%s\n' "$files"
            skip=true
            while IFS= read -r file; do
              case "$file" in
                docs/* | tools/command-center/* | .github/workflows/claude-code-review.yml | *.md) ;;
                *) skip=false; echo "Needs the full checks: $file"; break ;;
              esac
            done <<< "$files"
          else
            echo 'No usable list of changed files, so everything runs.'
          fi
          if [ "$skip" = true ]; then
            echo "Only docs, notes, tools and the Claude review workflow changed, so the $GITHUB_JOB job skipped its checks." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      # Node and the packages are installed on a docs-only pull request too, because the roadmap test below needs them (it is cheap: no browser, no build).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # On a docs-only pull request this is the one test that runs. tests/roadmap.test.ts reads docs/engine/migration.md and docs/roadmap/*, so the docs-only skip must not hide a drift there.
      # (On any other change `npm test` below runs it with all the other unit tests.)
      - name: Roadmap test (docs-only pull request)
        if: steps.scope.outputs.skip == 'true'
        run: npx vitest run tests/roadmap.test.ts
      - run: npm run lint
        if: steps.scope.outputs.skip != 'true'
      - run: npm run typecheck
        if: steps.scope.outputs.skip != 'true'
      - run: npm test
        if: steps.scope.outputs.skip != 'true'
      # Builds the game and the engine lab page (`vite build --mode lab`), then sorts the chunks into classes from the Vite manifests
      # (boot, lazy-2d, lazy-3d, lazy-other) and checks the caps and that the boot class holds no Pixi or Three.
      - name: Bundle budget (manifest classes and total gzip)
        if: steps.scope.outputs.skip != 'true'
        run: npm run budget

  e2e-shards:
    # The check is named `e2e (1/8)` to `e2e (8/8)`. The name is set here because the matrix has two values (shard and specs), and the default name would list both.
    # The job id is `e2e-shards` so that the gate job below can be called `e2e`.
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Each shard takes about 8.5 minutes of tests on a CI runner (about 30 seconds more for the setup). That is the total test time divided by eight; the longest single file (a part of sje-hack, 395 s) is below it.
    # The field parity spec (31 states) is four files, `sje-field-parity-a` to `-d`, which sit in different shards. 30 minutes is room for a runner several times as slow as the normal one
    # (a slow runner took 27 minutes for the old single field parity file, which takes about 10 on a normal one). Do not raise it to hide a hang: a spec that needs more should be split.
    timeout-minutes: 30
    strategy:
      # A failure in one shard must not cancel the others: the other reports are worth the wait.
      fail-fast: false
      matrix:
        # The specs are split by name, not with `--shard`: Playwright's `--shard` splits by test count, and it gave one shard 143 tests (the slow ones) and the other 78 (4 minutes).
        # The lists are balanced by measured time. The seconds of each spec are from the green run 38341695742 (one worker, the list reporter, per-test times from the log; see docs/CI.md).
        # Two numbers are not from that run: e2e/sje-field-parity-c.spec.ts carries 6 GPU-only states that skip themselves on CI (their time is about 0), and the split of sje-hack
        # into four parts is the sum of the per-test times of that run for the tests of each part. Shard totals in seconds of tests (the old layout, before the split of sje-hack, had 6/8 at 1,624):
        #   1/8 500 (hack C 392, economy 77, fx 31)                           2/8 503 (hack A 395, playthrough 108)
        #   3/8 508 (hack D 366, gameover 142)                                4/8 498 (hack B 362, field parity C 128, fxlab 8)
        #   5/8 505 (field parity A 368, canaries 83, shell 54)               6/8 510 (field parity D 255, field 152, stage parity 53, scene3d 50)
        #   7/8 505 (default-path 283, field parity B 167, gpufx 55)          8/8 509 (battle 194, draws 155, prod 122, chaos 38)
        # The total is about 4,037 seconds (the software GL of CI is slower than the 3,200 of the earlier layout), so eight shards average 505. sje-hack is four files, `sje-hack-a` to `-d`,
        # that share `e2e/sjehackkit.ts` (pass line 18 of docs/engine/m7-brief.md: the 59 tests run in CI). Field parity A (368 s) is now the longest single file after the hack parts (all under 400 s).
        # A new spec is added to the shard with the smallest total, or to the NOT_IN_CI list in tests/ci-shards.test.ts with a reason. That test fails on a spec that is in no list.
        include:
          - shard: '1/8'
            specs: >-
              e2e/sje-hack-c.spec.ts e2e/economy.spec.ts e2e/sje-fx.spec.ts
          - shard: '2/8'
            specs: >-
              e2e/sje-hack-a.spec.ts e2e/playthrough.spec.ts
          - shard: '3/8'
            specs: >-
              e2e/sje-hack-d.spec.ts e2e/gameover.spec.ts
          - shard: '4/8'
            specs: >-
              e2e/sje-hack-b.spec.ts e2e/sje-field-parity-c.spec.ts e2e/fxlab.spec.ts
          - shard: '5/8'
            specs: >-
              e2e/sje-field-parity-a.spec.ts e2e/sje-canaries.spec.ts e2e/sje-shell.spec.ts
          - shard: '6/8'
            specs: >-
              e2e/sje-field-parity-d.spec.ts e2e/sje-field.spec.ts e2e/sje-stage-parity.spec.ts e2e/sje-scene3d.spec.ts
          - shard: '7/8'
            specs: >-
              e2e/default-path.spec.ts e2e/sje-field-parity-b.spec.ts e2e/gpufx.spec.ts
          - shard: '8/8'
            specs: >-
              e2e/sje-battle.spec.ts e2e/sje-draws.spec.ts e2e/prod.spec.ts e2e/chaos.spec.ts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The same step as in `check`. Read the comment there.
      - name: Check which files changed
        id: scope
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          skip=false
          if git rev-parse --verify --quiet 'HEAD^2' > /dev/null \
              && files=$(git diff --no-renames --name-only 'HEAD^1' HEAD) \
              && [ -n "$files" ]; then
            printf 'Changed files:\n%s\n' "$files"
            skip=true
            while IFS= read -r file; do
              case "$file" in
                docs/* | tools/command-center/* | .github/workflows/claude-code-review.yml | *.md) ;;
                *) skip=false; echo "Needs the full checks: $file"; break ;;
              esac
            done <<< "$files"
          else
            echo 'No usable list of changed files, so everything runs.'
          fi
          if [ "$skip" = true ]; then
            echo "Only docs, notes, tools and the Claude review workflow changed, so the $GITHUB_JOB job skipped its checks." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.skip != 'true'
      # Only the browser that this job uses. The browsers are not cached: Playwright advises against
      # it, because restoring a cache takes about as long as the download, and the system packages
      # that --with-deps installs cannot be cached at all.
      - run: npx playwright install --with-deps chromium
        if: steps.scope.outputs.skip != 'true'
      # The specs are listed by name and not run as "all of them": shots.spec.ts and
      # audio-evidence.spec.ts rewrite files under docs/, they are not tests. So a new spec must
      # be added to a shard list (or to NOT_IN_CI in tests/ci-shards.test.ts, with a reason). playtest.spec.ts runs in playtest.yml. perf.spec.ts (frame timing) is not
      # here on purpose: a software renderer says nothing about GPU timing, so it runs locally (npm run perf).
      #
      # CI must be set. playwright.config.ts then uses the bundled Chromium (not Edge) and adds the
      # WebKit and Firefox projects. GitHub sets CI already. It is set here too, so the need is visible.
      # The game runs on the Pixi engine with no flag since M6, so every spec below that opens `/?debug` runs the new engine. Specs of the engine itself:
      # sje-canaries.spec.ts is the engine canary suite (M0): the lab page on SwiftShader, every trap with its negative control.
      # sje-draws.spec.ts counts draw calls and binds (the same on every machine).
      # sje-shell.spec.ts is the real game: the four screens, the default-start case (a Pixi canvas, no #fx and no #screen), the block test, context loss, the leak test.
      # sje-fx.spec.ts is the effects (M2): each effect read from the canvas, at the forced level. gpufx.spec.ts reads the effects level of the default page and the Options switch.
      # sje-bench.spec.ts is not here on purpose: it times a GPU (npm run perf), so it runs locally.
      # sje-battle.spec.ts (M3) plays the shipped battle on the Pixi stage: a win, a loss, a flee, a boss intro and the crisp-pixel check at two device pixel ratios.
      # sje-stage-parity.spec.ts (M3) is the regression parity of the stage: the 480x270 layout in the engine against the goldens, on SwiftShader (its Phaser-spike controls and
      # the 'art' mode, which needs Mark's git-ignored sheets, skip themselves on CI). The stage contract (tests/sje-stage-contract.test.ts, tests/battlestage-640.test.ts,
      # tests/enemies-data.test.ts) runs in `npm test`, and so does tests/sje-boot-order.test.ts (M6: `routePostfx` before `bootGame`). The pictures for Mark (media/) are made locally.
      # sje-field.spec.ts (M5) plays the shipped field on the Pixi stage (walk, real warps, emote, follower, the editor contract, both fallbacks, the leak tests, crisp pixels).
      # sje-field-parity-a.spec.ts to sje-field-parity-d.spec.ts (M5; one file until M6, then two, now four to balance the shards, sharing e2e/sjefieldparityparts.ts) are the field against references made from the OLD field on SwiftShader (tests/fixtures/sjefield/soft; the old path is gone, so they cannot be made
      # again): 31 fixed states, the measured bounds and the controls. The strict gate of the brief does not hold for lit frames and is opt in (SJEFIELD_STRICT=1). The pictures for
      # Mark are made locally.
      # default-path.spec.ts (M6) is the goldens of the default page: title, field (rustyard), a battle and Options, one frame each, against tests/fixtures/defaultpath/soft (made with
      # M6_REFS=1 CI=1), with a 2/255 step and a one-pixel move as controls.
      # fxlab.spec.ts is the FX lab on the new engine (M6): list, edit, the invalid-edit case, and the save endpoint's dry run.
      # e2e/webgl2kit.ts is a helper of prod.spec.ts and gameover.spec.ts (the E5 check), not a spec: it is not in the list.
      # Each shard runs its own spec list (matrix `specs`). Every spec above must be in exactly one list. tests/ci-shards.test.ts checks it.
      # This job uploads no artifact and no report (the reporter is `list`), so the shards have no file name to clash on. If an upload step is ever added, put the
      # shard in its name (`matrix.shard` has a slash, so use `strategy.job-index`), or the second upload fails with a name conflict.
      - name: E2E on Chromium, shard ${{ matrix.shard }} (every spec except the playtest, with the engine canaries)
        if: steps.scope.outputs.skip != 'true'
        run: >-
          npx playwright test --project=chromium ${{ matrix.specs }}
        env:
          CI: '1'

  # The gate. The ruleset must require this check (with `check` and `e2e-engines`) and not the shard names, so the shard count can change freely. The ruleset was set on 2026-10-11 (PR #64 merged).
  # `if: always()` makes it run when a shard fails or is cancelled. Without it a failed shard would SKIP this job, and a skipped job reports success.
  # It fails closed: only a `success` result of the whole shard matrix passes (`failure`, `cancelled` and `skipped` all fail).
  e2e:
    needs: e2e-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every e2e shard succeeded
        env:
          SHARDS_RESULT: ${{ needs.e2e-shards.result }}
        run: |
          echo "The e2e shards finished with: $SHARDS_RESULT"
          if [ "$SHARDS_RESULT" != 'success' ]; then
            echo '::error::An e2e shard did not succeed (failed, cancelled or skipped), so the e2e gate fails.'
            exit 1
          fi

  e2e-engines:
    runs-on: ubuntu-latest
    # The usual run time is under 10 minutes (see `e2e`).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The same step as in `check`. Read the comment there.
      - name: Check which files changed
        id: scope
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          skip=false
          if git rev-parse --verify --quiet 'HEAD^2' > /dev/null \
              && files=$(git diff --no-renames --name-only 'HEAD^1' HEAD) \
              && [ -n "$files" ]; then
            printf 'Changed files:\n%s\n' "$files"
            skip=true
            while IFS= read -r file; do
              case "$file" in
                docs/* | tools/command-center/* | .github/workflows/claude-code-review.yml | *.md) ;;
                *) skip=false; echo "Needs the full checks: $file"; break ;;
              esac
            done <<< "$files"
          else
            echo 'No usable list of changed files, so everything runs.'
          fi
          if [ "$skip" = true ]; then
            echo "Only docs, notes, tools and the Claude review workflow changed, so the $GITHUB_JOB job skipped its checks." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.skip != 'true'
      # Only WebKit and Firefox, and no browser cache (see the same step in `e2e`).
      - run: npx playwright install --with-deps webkit firefox
        if: steps.scope.outputs.skip != 'true'
      # These two engines run only the flows that most likely differ between engines: storage, the
      # unload prompt, keyboard and audio unlock (see playwright.config.ts). CI must be set for the
      # config to add the two projects.
      # The game needs WebGL 2 since M6 (the Pixi engine is the only engine). WebKit has it on this runner and plays the whole flow. Headless Firefox on this
      # runner has none, so its game flow is skipped by `browserName` and one E5 test checks that the page shows the "cannot run WebGL 2" message and
      # starts no game (e2e/webgl2kit.ts, used by prod.spec.ts and gameover.spec.ts). Do not drop Firefox from this job: it is the one real engine that checks E5.
      - name: E2E on WebKit and Firefox (game over and saves, shipped build)
        if: steps.scope.outputs.skip != 'true'
        run: >-
          npx playwright test --project=webkit --project=firefox
          e2e/gameover.spec.ts e2e/prod.spec.ts
        env:
          CI: '1'
