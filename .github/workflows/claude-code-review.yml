name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    # Skip drafts. Skip pull requests from forks too: GitHub withholds secrets from them, so
    # the review cannot sign in there.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: the step "Post the review on the pull request" posts the findings with the job's token.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # A headless run ends when the main session ends. This setting runs any subagent in the
          # foreground, so the run waits for it (anthropics/claude-code-action issues 1499 and 1646).
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
          # Run any subagent on Sonnet. The FORCE flag makes this win over a model that Claude passes.
          CLAUDE_CODE_SUBAGENT_MODEL: sonnet
          CLAUDE_CODE_SUBAGENT_MODEL_FORCE: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The built-in /code-review command (docs: code.claude.com/docs/en/code-review). It replaces
          # the code-review plugin. On Claude Code 2.1.285 and later with Sonnet 5.5, the plugin skips
          # its review agents and still posts "No issues found" (anthropics/claude-code issue 100401).
          # The built-in command reviews the diff itself and reports its findings. "medium" is its effort
          # level. There is no --comment: that flag can silently print the findings instead of posting
          # them (anthropics/claude-code issue 88190), and here it posted nothing. The step "Post the
          # review on the pull request" posts them from the run's execution file.
          prompt: '/code-review medium ${{ github.event.pull_request.number }}'
          # The review reads the pull request with these gh commands. A run without them cannot
          # read the diff. No tool here posts a comment: the posting step does that.
          # --permission-mode auto is the mode that Anthropic's own review workflow uses
          # (anthropics/claude-code-action, .github/workflows/claude-review.yml). A classifier
          # approves a command outside this list, such as a grep or a cd, when it is safe.
          claude_args: '--permission-mode auto --model sonnet --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action hides Claude's output, so the log shows only counts (turns, cost, "is_error").
      # Print the final result text of every run: the cause of a failed call (for example
      # "Failed to authenticate. API Error: 401 ..."), or the reason a review stopped early.
      # The review posts the same kind of text on the pull request. stop-commands keeps the text
      # from running workflow commands.
      - name: Show the Claude review result
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          file="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          if [ ! -f "$file" ]; then echo "No Claude execution file found."; exit 0; fi
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          jq -r '[.[] | select(.type == "result")] | last // {} | (.result // .errors // "no result message") | tostring | .[0:1000]' "$file" || echo "Could not read $file"
          echo "::$stop::"

      # Post the findings on the pull request, as one review with an inline comment on each line.
      # If GitHub refuses a line, the script posts one comment with the full list instead. It never
      # fails the job. The script is .github/scripts/post-review.mjs.
      - name: Post the review on the pull request
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/post-review.mjs

      # The action logs only a count of denied tool calls. List them (tool name and the first
      # 150 characters of the input) and add a warning, so a "No issues found" from a run that
      # could not read the pull request is easy to spot. stop-commands keeps the text from
      # running workflow commands.
      - name: List denied tool calls
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          file="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          if [ ! -f "$file" ]; then echo "No Claude execution file found."; exit 0; fi
          count="$(jq '[.[] | select(.type == "result")] | last // {} | (.permission_denials // []) | length' "$file" 2>/dev/null || echo 0)"
          echo "Denied tool calls: $count"
          if [ "$count" -gt 0 ]; then
            echo "::warning title=Claude review had denied tool calls::$count tool calls were denied, so the review may be incomplete. The step log lists them."
            stop="$(openssl rand -hex 16)"
            echo "::stop-commands::$stop"
            jq -r '[.[] | select(.type == "result")] | last // {} | (.permission_denials // []) | .[] | "denied: \(.tool_name) \((.tool_input | tostring)[0:150])"' "$file" || echo "Could not read $file"
            echo "::$stop::"
          fi
