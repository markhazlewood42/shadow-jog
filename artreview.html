<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Art pass review</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2307060d'/%3E%3Crect x='3' y='3' width='10' height='10' fill='none' stroke='%233fe0f0' stroke-width='1.6'/%3E%3C/svg%3E" />
    <!-- Dev-only page (npm run dev, then /artreview.html): the PixelLab art pass, for Mark to pick from.
         Not part of the build (vite builds index.html only). Code: src/dev/artreview.ts. -->
    <style>
      :root {
        --bg: #0d0c14;
        --panel: #17151f;
        --panel-2: #1f1c2a;
        --line: #2e2a3d;
        --text: #e9e6f2;
        --dim: #9b96ad;
        --accent: #ff4fb0;
        --cyan: #3fe0f0;
        --good: #62e06a;
        --bad: #ff5a5a;
        --best: #ffcc3d;
        --stage: #2a2638;
      }
      * { box-sizing: border-box; }
      html, body { background: var(--bg); color: var(--text); }
      body { margin: 0; font: 14px/1.45 system-ui, 'Segoe UI', sans-serif; }
      button, input, textarea, select { font: inherit; color: inherit; }
      header {
        position: sticky; top: 0; z-index: 5; background: rgba(13, 12, 20, 0.96);
        border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
      }
      header h1 { font-size: 16px; margin: 0; letter-spacing: 0.04em; }
      header h1 b { color: var(--accent); }
      .group { display: flex; gap: 4px; align-items: center; }
      .group > span { color: var(--dim); font-size: 12px; margin-right: 2px; }
      .chip {
        background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px;
      }
      .chip[aria-pressed='true'] { border-color: var(--cyan); color: var(--cyan); }
      a.chip { color: var(--cyan); text-decoration: none; }
      .status { margin-left: auto; color: var(--dim); font-size: 12px; text-align: right; }
      .status .err { color: var(--bad); }
      .layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 60px); }
      nav { border-right: 1px solid var(--line); padding: 12px; position: sticky; top: 58px; align-self: start; max-height: calc(100vh - 60px); overflow: auto; }
      nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 14px 0 6px; }
      nav a { display: flex; justify-content: space-between; gap: 6px; color: var(--text); text-decoration: none; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
      nav a:hover { background: var(--panel-2); }
      nav a .n { color: var(--dim); font-size: 11px; }
      nav a.done .n { color: var(--good); }
      main { padding: 16px; min-width: 0; }
      .intro { max-width: 900px; color: var(--dim); margin: 0 0 16px; }
      .intro b { color: var(--text); }
      section > h2 { font-size: 18px; margin: 26px 0 10px; }
      article { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
      article.decided { border-color: #3d5a3f; }
      article h3 { margin: 0; font-size: 15px; display: flex; gap: 10px; align-items: baseline; }
      article h3 small { color: var(--dim); font-weight: 400; font-size: 12px; }
      article .note { color: var(--dim); margin: 2px 0 10px; font-size: 13px; }
      .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
      figure { margin: 0; background: var(--panel-2); border: 2px solid transparent; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
      figure.current { border-style: dashed; border-color: var(--line); }
      figure[data-verdict='best'] { border-color: var(--best); }
      figure[data-verdict='good'] { border-color: var(--good); }
      figure[data-verdict='no'] { border-color: #5a2a2a; opacity: 0.55; }
      figure[data-verdict='no']:hover { opacity: 1; }
      figcaption { font-size: 12px; color: var(--dim); max-width: 460px; }
      figcaption b { color: var(--text); font-weight: 600; }
      .stage { background: var(--stage); border-radius: 6px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; justify-content: flex-start; }
      .stage.light { background: #8a8698; }
      .stage.mid { background: #4a4658; }
      .stage canvas { image-rendering: pixelated; display: block; }
      .row.wide { flex-direction: column; }
      .row.wide figure { max-width: 100%; }
      img.shot { display: block; max-width: 100%; width: 960px; image-rendering: pixelated; border-radius: 6px; }
      img.shot.map { width: auto; max-width: 100%; }
      .strip { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; margin: 6px 0 4px; }
      .strip-label { font-size: 11px; color: var(--dim); width: 100%; }
      button.frame { background: var(--stage); border: 2px solid transparent; border-radius: 4px; padding: 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; }
      button.frame:hover { border-color: var(--line); }
      button.frame span { font-size: 10px; color: var(--dim); }
      button.frame.flagged { border-color: var(--bad); }
      button.frame.flagged span { color: var(--bad); font-weight: 700; }
      details.frames summary { cursor: pointer; font-size: 12px; color: var(--cyan); margin-top: 6px; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .cell span { font-size: 10px; color: var(--dim); }
      .chips { display: flex; flex-wrap: wrap; gap: 4px; }
      .verdicts { display: flex; gap: 4px; }
      .verdicts button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12px; }
      .verdicts button[data-v='best'][aria-pressed='true'] { background: var(--best); color: #221a00; border-color: var(--best); }
      .verdicts button[data-v='good'][aria-pressed='true'] { background: var(--good); color: #0b2a0d; border-color: var(--good); }
      .verdicts button[data-v='no'][aria-pressed='true'] { background: var(--bad); color: #2a0b0b; border-color: var(--bad); }
      .verdicts .try { margin-left: auto; color: var(--cyan); }
      input.optnote, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 12px; }
      textarea { min-height: 38px; resize: vertical; margin-top: 10px; font-size: 13px; }
      .pending, .failed { color: var(--dim); font-size: 12px; padding: 18px 10px; text-align: center; }
      .failed { color: var(--bad); max-width: 300px; }
      .banner { background: #3a1420; border: 1px solid var(--bad); color: #ffd0d8; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
      .hidden { display: none !important; }
      @media (max-width: 800px) {
        .layout { grid-template-columns: 1fr; }
        nav { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1><b>SHADOW JOG</b> · art pass review</h1>
      <div class="group" id="zoom"><span>Zoom</span></div>
      <div class="group" id="bgs"><span>Backdrop</span></div>
      <div class="group" id="show"><span>Show</span></div>
      <div class="group"><button class="chip" id="reload" title="Pick up newly generated options">Refresh</button><a class="chip" id="trypicks" target="_blank" rel="noopener">Try picks in game ↗</a></div>
      <div class="status" id="status">Loading…</div>
    </header>
    <div class="layout">
      <nav id="nav"></nav>
      <main id="main"></main>
    </div>
    <script type="module" src="/src/dev/artreview.ts"></script>
  </body>
</html>
