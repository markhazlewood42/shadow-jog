    <!-- Dev-only page (npm run dev, then /sjestage.html): the battle stage slice (one stage, one hero, one enemy, HUD off) on the Shadow Jog
         Engine (src/sje), step B1 of the engine-platform spike (docs/spikes/engine-platform.md). Not part of the build: vite builds
         index.html only, so none of this is in the shipped game. Code: src/battlestage/ (the stage), src/sje-lab/stage*.ts (this page).
         The Phaser spike's own page is /stagelab.html on branch spike/phaser-stage; the parity harness compares the two.
         Query: ?manual leaves the clock to the tests (window.__SJESTAGE__.show / step); ?standins skips Mark's sheets;
         ?seed=7 sets the floor seed; ?tick=0 the first tick shown. -->
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; background: #07060d; }
      #stage { position: fixed; inset: 0; }
      /* The engine sizes and places the canvas itself, in whole device pixels (width, height, left, top, image-rendering). */
      #status { position: fixed; left: 8px; bottom: 6px; color: #6a6f89; font: 11px/1.3 ui-monospace, Consolas, monospace; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="status">starting...</div>
    <script type="module" src="/src/sje-lab/stagemain.ts"></script>
