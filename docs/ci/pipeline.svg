<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 764" width="900" height="764" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title>Shadow Jog CI: before and after</title><desc>Timeline of CI jobs on a game PR. Before: 4 shards, about 12 minutes. After: 8 balanced shards plus an e2e gate, a target of about 7 minutes (not measured yet).</desc>
<rect width="900" height="764" fill="#f5f5f5"/>
<text x="30" y="38" font-size="20" font-weight="700" fill="#2d3142">What a push to a game PR waits for</text>
<text x="30" y="58" font-size="12" fill="#4f5d75">Each bar is one CI job. All jobs start together. The slowest job sets the wait. BEFORE is measured (run 38150548004). AFTER is a target, not a measurement.</text>
