<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engine code levels</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0d0c1f;   /* Shadow Jog panel bottom */
      --color-ink:     #f4f1ff;
      --color-muted:   #bfc3e4;
      --color-accent:  #ffcc3d;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 960px; width: 100%; }
    /* The SVG holds its readable width (min-width equals the viewBox width).
       This wrapper lets a narrow screen scroll the diagram, not the page. */
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack &middot; Shadow Jog engine</p>
    <h1>Engine code levels</h1>

    <div class="diagram-container">
    <!-- Type ramp is a deliberate exception to the standard doc-inline ramp. This figure shows at about
         880px wide in a README (scale 0.92), so names are 16, descriptions 13 and all mono text 12.
         That keeps every label near 11px on screen. -->
    <svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="engine-layers-title engine-layers-desc">
      <title id="engine-layers-title">Engine code levels</title>
      <desc id="engine-layers-desc">Seven stacked levels of the engine, from game content at L6 down to core at L0, with the rule that imports point down only. L6 reaches the lazy 3D chunk at L5 by a dynamic import and reaches the L5 door and result types by a static import. L5 imports levels 0 to 3. Pure logic and the legacy engine sit outside the levels.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc3e4"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8f94bd"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#0d0c1f"/>

      <!-- Header: the rule, how it is enforced, how to read the arrows -->
      <text x="40" y="60" fill="#f4f1ff" font-size="24" font-style="italic" font-family="'Instrument Serif', serif">Dependencies point down only.</text>
      <text x="920" y="60" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">ENFORCED BY A BIOME RULE AND A VITEST IMPORT SCAN</text>
      <text x="40" y="84" fill="#8f94bd" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.02em">EACH BAND LISTS THE LEVELS IT MAY IMPORT. ARROWS SHOW THE OTHER IMPORTS.</text>

      <!-- Zones (outline only, so label masks match the page) -->
      <rect x="40" y="100" width="572" height="496" rx="6" fill="none" stroke="rgba(122,128,196,0.28)" stroke-width="1"/>
      <rect x="740" y="268" width="180" height="328" rx="6" fill="none" stroke="rgba(122,128,196,0.28)" stroke-width="1"/>
      <text x="56" y="122" fill="#8f94bd" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NUMBERED LEVELS</text>
      <text x="596" y="122" fill="#8f94bd" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">L0-L4 AND PART OF L5 LIVE IN SRC/SJE/</text>
      <text x="756" y="288" fill="#8f94bd" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NOT A LEVEL</text>

      <!-- Arrows (drawn before the boxes) -->
      <!-- L6 to pure logic: long edge, soft stroke so amber stays the only strong accent -->
      <path d="M 600 162 H 888 Q 896 162 896 170 V 484" fill="none" stroke="#8f94bd" stroke-width="1.2" marker-end="url(#arrow-soft)"/>
      <!-- pure logic to L0 -->
      <path d="M 756 540 H 600" fill="none" stroke="#8f94bd" stroke-width="1.2" marker-end="url(#arrow-soft)"/>
      <!-- L6 to L5 door and result types, static, short arrow in the gap -->
      <path d="M 352 188 V 216" fill="none" stroke="#bfc3e4" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="200" y="192" width="144" height="16" rx="2" fill="#0d0c1f"/>
      <text x="272" y="204" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">DOOR, RESULT TYPES</text>
      <!-- L6 to L5 chunk, dynamic import, short arrow in the gap -->
      <path d="M 520 188 V 216" fill="none" stroke="#bfc3e4" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="392" y="192" width="120" height="16" rx="2" fill="#0d0c1f"/>
      <text x="452" y="204" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">DYNAMIC IMPORT</text>
      <!-- L5 to L3, L2, L1, L0: elbow down the left side into a bracket that spans the four bands -->
      <path d="M 196 240 H 156 Q 148 240 148 248 V 452 Q 148 460 156 460 H 178" fill="none" stroke="#bfc3e4" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 194 372 H 182 V 564 H 194" fill="none" stroke="#bfc3e4" stroke-width="1.2"/>
      <rect x="52" y="346" width="88" height="16" rx="2" fill="#0d0c1f"/>
      <text x="96" y="358" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">L0 TO L3</text>
      <!-- L3 to legacy engine, dashed -->
      <path d="M 600 390 H 756" fill="none" stroke="#bfc3e4" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="622" y="366" width="112" height="16" rx="2" fill="#0d0c1f"/>
      <text x="678" y="378" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">LEGACY ADAPTER</text>
      <rect x="622" y="398" width="112" height="16" rx="2" fill="#0d0c1f"/>
      <text x="678" y="410" fill="#8f94bd" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">MIGRATION ONLY</text>

      <!-- Level stack -->
<rect x="196" y="136" width="404" height="52" rx="6" fill="#1c1a3a" stroke="#7a80c4" stroke-width="1"/>
<text x="210" y="160" fill="#bfc3e4" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.1em">L6</text>
      <text x="242" y="160" fill="#f4f1ff" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Game content</text>
      <text x="242" y="179" fill="#bfc3e4" font-size="13" font-family="'Geist', sans-serif">scenes, scripts, painters</text>
      <text x="586" y="160" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">MAY IMPORT: L4, L5</text>
<rect x="196" y="216" width="404" height="356" rx="6" fill="#1c1a3a"/>
<line x1="196" y1="364" x2="600" y2="364" stroke="rgba(122,128,196,0.28)" stroke-width="1"/>
<line x1="196" y1="416" x2="600" y2="416" stroke="rgba(122,128,196,0.28)" stroke-width="1"/>
<line x1="196" y1="468" x2="600" y2="468" stroke="rgba(122,128,196,0.28)" stroke-width="1"/>
<line x1="196" y1="520" x2="600" y2="520" stroke="rgba(122,128,196,0.28)" stroke-width="1"/>
<rect x="196" y="216" width="404" height="356" rx="6" fill="none" stroke="#7a80c4" stroke-width="1"/>
<text x="210" y="240" fill="#bfc3e4" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.1em">L5</text>
      <text x="242" y="240" fill="#f4f1ff" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Lazy 3D chunk</text>
      <text x="586" y="240" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">SJE/THREE MAY IMPORT L0-L3</text>
      <text x="242" y="259" fill="#bfc3e4" font-size="13" font-family="'Geist', sans-serif">the only user of three</text>
      <text x="242" y="278" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.02em">HACK3D MAY IMPORT L4, SJE/THREE</text>
      <text x="242" y="297" fill="#bfc3e4" font-size="13" font-family="'Geist', sans-serif">hack3d: door and result types load up front</text>
<rect x="196" y="312" width="404" height="52" fill="#1c1a3a"/>
      <rect x="196" y="312" width="404" height="52" fill="rgba(255,204,61,0.10)" stroke="#ffcc3d" stroke-width="1"/>
      <text x="210" y="336" fill="#ffcc3d" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.1em">L4</text>
      <text x="242" y="336" fill="#f4f1ff" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Facade</text>
      <text x="242" y="355" fill="#bfc3e4" font-size="13" font-family="'Geist', sans-serif">the only import for game code</text>
      <text x="586" y="336" fill="#ffcc3d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">MAY IMPORT: L3</text>
<text x="210" y="388" fill="#bfc3e4" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.1em">L3</text>
      <text x="242" y="388" fill="#f4f1ff" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Runtime</text>
      <text x="242" y="407" fill="#bfc3e4" font-size="13" font-family="'Geist', sans-serif">Game, scenes, loader, input</text>
      <text x="586" y="388" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">MAY IMPORT: L2, L1, L0</text>
<text x="210" y="440" fill="#bfc3e4" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.1em">L2</text>
      <text x="242" y="440" fill="#f4f1ff" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Display</text>
      <text x="242" y="459" fill="#bfc3e4" font-size="13" font-family="'Geist', sans-serif">GameObjects, View3D, Camera, Effects</text>
      <text x="586" y="440" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">MAY IMPORT: L1, L0</text>
<text x="210" y="492" fill="#bfc3e4" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.1em">L1</text>
      <text x="242" y="492" fill="#f4f1ff" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Render</text>
      <text x="242" y="511" fill="#bfc3e4" font-size="13" font-family="'Geist', sans-serif">Pixi, raw GL, frame textures</text>
      <text x="586" y="492" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">MAY IMPORT: L0</text>
<text x="210" y="544" fill="#bfc3e4" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.1em">L0</text>
      <text x="242" y="544" fill="#f4f1ff" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Core</text>
      <text x="242" y="563" fill="#bfc3e4" font-size="13" font-family="'Geist', sans-serif">size, FixedLoop, EventEmitter, Rng. No Pixi, no DOM.</text>
      <text x="586" y="544" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">MAY IMPORT: NOTHING</text>

      <!-- Side zone nodes -->
      <rect x="756" y="344" width="128" height="92" rx="6" fill="#1c1a3a" stroke="rgba(244,241,255,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="820" y="368" fill="#f4f1ff" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Legacy engine</text>
      <text x="820" y="388" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">src/engine/</text>
      <text x="820" y="406" fill="#bfc3e4" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">via LegacyScene.</text>
      <text x="820" y="424" fill="#bfc3e4" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">Deleted at M8.</text>
      <rect x="756" y="484" width="152" height="76" rx="6" fill="#1c1a3a" stroke="#7a80c4" stroke-width="1"/>
      <text x="832" y="508" fill="#f4f1ff" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pure logic *</text>
      <text x="832" y="528" fill="#bfc3e4" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">src/battle,</text>
      <text x="832" y="546" fill="#bfc3e4" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">game state</text>

      <!-- Legend and footnote -->
      <line x1="40" y1="612" x2="920" y2="612" stroke="rgba(122,128,196,0.28)" stroke-width="1"/>
      <line x1="40" y1="632" x2="72" y2="632" stroke="#bfc3e4" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="82" y="636" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.02em">STATIC IMPORT</text>
      <line x1="220" y1="632" x2="252" y2="632" stroke="#bfc3e4" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="262" y="636" fill="#bfc3e4" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.02em">SPECIAL IMPORT</text>
      <text x="40" y="664" fill="#bfc3e4" font-size="16" font-family="'Instrument Serif', serif" font-style="italic">* The hack sim (src/hack3d/sim) is pure logic too. Its folder is inside level 5.</text>
    </svg>
    </div>
  </div>
</body>
</html>
